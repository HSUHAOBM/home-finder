[project]
name = "home-finder"
version = "0.1.0"
description = "依個人條件篩選與排序房源的可擴充工具"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "playwright>=1.61.0",
    "tzdata>=2026.3",
]

[project.scripts]
home-finder = "home_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser_e2e: opt-in real-browser tests against an isolated local server",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_finder"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
